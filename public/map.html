<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<!-- 로컬 개발용. 카카오는 Referer로 도메인을 검사하는데, 아직 등록이 반영되지 않아
     Referer를 보내지 않는 방식으로 우회합니다. 도메인 등록이 확인되면 이 줄을 지우세요. -->
<title>르슐랭 가이드 — 카카오맵</title>
<link rel="icon" type="image/png" sizes="32x32" href="/lesulin-icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/lesulin-icon-192.png">
<link rel="shortcut icon" href="/lesulin-favicon.ico">
<link rel="apple-touch-icon" href="/img/brand/apple-icon.png?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap">
<style>
:root{
  --side-w:276px; --panel-w:330px;   /* 드래그로 바뀝니다 (app.js) */
  /* v3 스타일 가이드와 같은 값 — 시작 화면(index.html)과 한 서비스처럼 보이게 이름은 두고 값만 맞춥니다 */
  --paper:#FFFFFF; --sub:#F8F6F3; --sub2:#EFECE7; --shell:#F8F6F3;
  --ink:#1F1B18; --ink2:#6B635C; --muted:#A39B93; --line:#ECE8E3;
  --coral:#F2622A; --coral-soft:#FEEDE5; --coral-ink:#D9501A;
  --teal:#15BBA2; --teal-soft:#DFF5F0; --teal-ink:#0E6E5F;
  --good:#17806B; --bad:#D9392B;
  --amber:#8A6A1E; --amber-bg:#FBF2DD; --amber-ln:#EBD8A6;
  --yt:#E8402A;
  --sh1:0 1px 3px rgba(30,24,16,.10); --sh2:0 4px 14px rgba(30,24,16,.14);
  --sh3:0 16px 40px -10px rgba(30,24,16,.30);
  --sans:'Noto Sans KR','Apple SD Gothic Neo',-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:'IBM Plex Mono','Noto Sans KR',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--shell);color:var(--ink);font-family:var(--sans);font-size:13px;
  overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:left}
input{font:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.t1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

#app{display:flex;flex-direction:column;height:100dvh;background:var(--paper)}
/* 상단 좌·우 칸의 경계선이 아래 패널과 맞아떨어지게 폭을 고정합니다 */
.topleft{flex:none;height:62px;display:flex;align-items:stretch;justify-content:center;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;padding:0 16px;flex:none;text-decoration:none;color:inherit}
/* 시작 화면과 같은 로고 — 오렌지 사각 + 흰 마름모 */
.brand .mark{width:28px;height:28px;border-radius:8px;flex:none;display:block}
.brand b{font-size:15px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.srch{flex:1;display:flex;align-items:center;gap:11px;padding:0 18px;position:relative;min-width:0}
.srch svg{flex:none;color:var(--muted)}
.srch input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--ink);font-size:17px;font-weight:600}
.srch input::placeholder{color:#BFBCB5;font-weight:400}
.srch .clr{width:19px;height:19px;border-radius:50%;background:var(--sub2);color:var(--muted);display:grid;place-items:center;font-size:11px;flex:none}
.ac{position:absolute;left:12px;right:18px;top:calc(100% + 4px);z-index:60;background:var(--paper);
  border:1px solid var(--line);border-radius:13px;box-shadow:var(--sh3);overflow:hidden;max-height:58vh;overflow-y:auto}
.ac .g+.g{border-top:1px solid var(--line)}
.ac .gl{margin:0;padding:9px 14px 4px;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ac button{display:flex;width:100%;align-items:center;gap:9px;padding:7px 14px}
.ac button:hover{background:var(--sub)}
.ac .m{font-size:13px;font-weight:500;min-width:0}
.ac .s{font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:auto;white-space:nowrap}
.ac .empty{margin:0;padding:16px 14px;font-size:12.5px;color:var(--muted)}

.body{flex:1;display:flex;min-height:0}
/* 폭·손잡이는 wrap 이, 스크롤은 안쪽 aside 가 맡습니다.
   손잡이를 overflow-y:auto 안에 두면 잘려서 집히지 않습니다. */
.sidewrap{width:var(--side-w);flex:none;position:relative;display:flex;flex-direction:column;min-height:0;
  border-right:1px solid var(--line)}
.side{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;overflow-y:auto}
.feed{max-height:250px}
.sgrp{padding:14px 16px;border-bottom:1px solid var(--line)}
.sect-t{display:flex;align-items:center;justify-content:space-between;margin:0 0 9px}
.sect-t b{font-size:12.5px;font-weight:650}
.sect-t span{font-family:var(--mono);font-size:10px;color:var(--muted)}

/* 지역 — 유튜버 위에 한 줄, 가로 스크롤 */
  color:var(--ink2);white-space:nowrap;transition:background .12s}
  border:1px solid var(--line);border-radius:0 0 14px 14px;box-shadow:var(--sh3);overflow:hidden;
  display:flex;flex-direction:column;max-height:min(62vh,520px)}
.frow.togrow{display:flex;gap:7px;flex-direction:row}
.tog{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;height:34px;border-radius:10px;
  border:1px solid var(--line);font-size:11.5px;font-weight:500;color:var(--ink2);background:var(--paper);
  transition:all .12s;white-space:nowrap}
.tog i{width:7px;height:7px;border-radius:50%;background:var(--line);flex:none;transition:background .12s}
.tog:hover{border-color:var(--muted)}
.tog[aria-pressed=true]{background:var(--coral-soft);border-color:var(--coral);color:var(--coral-ink);font-weight:600}
.tog[aria-pressed=true] i{background:var(--coral)}
.chip{flex:none;padding:5px 10px;border-radius:999px;font-size:11.5px;color:var(--ink2);
  border:1px solid var(--line);background:var(--paper);white-space:nowrap;transition:all .12s}
.chip:hover{border-color:var(--muted)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.chip .c{font-family:var(--mono);opacity:.55;margin-left:4px}
.chip.on .c{opacity:.8}

.ytlist{display:flex;flex-direction:column;gap:2px}
.ytmore{display:flex;align-items:center;justify-content:center;gap:5px;width:100%;
  padding:7px;margin-top:2px;border-radius:10px;border:1px dashed var(--line);
  color:var(--ink2);font-size:11.5px;font-weight:600;background:none;cursor:pointer}
.ytmore:hover{background:var(--sub);border-style:solid}
.ytmore .faces{display:flex}
.ytmore .faces img{width:16px;height:16px;border-radius:50%;object-fit:cover;flex:none}
.ytmore .faces img + img{margin-left:-5px;box-shadow:0 0 0 1.5px #fff}
.ytrow{display:flex;align-items:center;gap:9px;padding:5px 7px;border-radius:10px;width:100%;transition:background .12s}
.ytrow:hover{background:var(--sub)}
.ytrow.on{background:var(--coral-soft);box-shadow:inset 0 0 0 1.5px var(--coral)}
.ytrow.on .nm b{color:var(--coral-ink)}
.ytrow img{width:28px;height:28px;border-radius:50%;flex:none;object-fit:cover;background:var(--sub2)}
.ytrow .nm{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.ytrow .nm b{font-size:12.5px;font-weight:600}
.ytrow .nm span{font-family:var(--mono);font-size:9.5px;color:var(--muted)}

.feed{display:flex;flex-direction:column;gap:11px;max-height:252px;overflow-y:auto}
.fitem{display:flex;gap:9px;align-items:flex-start;width:100%;border-radius:8px}
.fitem:hover{background:var(--sub)}
.fitem img{width:84px;height:47px;border-radius:7px;object-fit:cover;flex:none;background:var(--sub2)}
.fitem .ft{min-width:0;display:flex;flex-direction:column;gap:3px;padding-top:1px}
.fitem .ft b{font-size:11px;font-weight:600;line-height:1.35}
.fitem .ft span{font-family:var(--mono);font-size:9.5px;color:var(--muted)}

/* 필터 */
.frow{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.frow:last-child{margin-bottom:0}
.flab{display:flex;align-items:baseline;justify-content:space-between;font-size:11.5px;color:var(--ink2)}
.flab em{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--coral);font-weight:600}
input[type=range]{width:100%;height:3px;-webkit-appearance:none;appearance:none;background:var(--line);
  border-radius:2px;outline:none;margin:7px 0 2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;
  background:var(--ink);cursor:pointer;box-shadow:var(--sh1)}
.hist{display:flex;align-items:flex-end;gap:2px;height:22px}
.hist i{flex:1;background:var(--sub2);border-radius:2px;min-height:2px}
.hist i.on{background:#C9C6BF}
.scaleRow{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;color:var(--muted)}
.swrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.swrow span{font-size:11.5px;color:var(--ink2)}
.sw{width:34px;height:19px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:13px;height:13px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:var(--sh1)}
.sw[aria-pressed=true]{background:var(--coral)}
.sw[aria-pressed=true]::after{transform:translateX(15px)}
/* 업종 — 한 줄로 두고 옆으로 넘겨 봅니다 */
.catrow{display:flex;flex-wrap:nowrap;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;cursor:grab;user-select:none}
.catrow::-webkit-scrollbar{display:none}
.catrow.dragging{cursor:grabbing}
.catrow .chip{flex:none;white-space:nowrap}

/* 카카오맵 */
.mapwrap{flex:1;min-width:0;position:relative;background:var(--sub2)}
#kmap{position:absolute;inset:0}
.mapmsg{position:absolute;inset:0;display:grid;place-items:center;padding:30px;text-align:center;
  background:var(--sub);z-index:3}
.mapmsg div{max-width:420px}
.mapmsg h3{margin:0 0 8px;font-size:15px;font-weight:650}
.mapmsg p{margin:0;font-size:12.5px;line-height:1.7;color:var(--ink2)}
.mapmsg code{font-family:var(--mono);font-size:11.5px;background:var(--paper);padding:2px 6px;border-radius:5px}
/* 오버레이 안에서는 전역 img{max-width:100%}가 사진을 찌그러뜨립니다 */
.pinbox{display:flex;flex-direction:column;align-items:center;cursor:pointer;width:max-content;
  filter:drop-shadow(0 3px 6px rgba(30,24,16,.32))}
.pinbox img{width:34px;height:34px;max-width:none;flex:none;border-radius:50%;
  border:2.5px solid #fff;object-fit:cover;background:#fff}
.pinbox.sel img{width:46px;height:46px;max-width:none;border-width:3px;border-color:var(--coral)}
.pinbox .tail{width:0;height:0;margin-top:-2px;border-left:5px solid transparent;border-right:5px solid transparent;border-top:8px solid #fff}
/* 내가 고른 유튜버가 간 곳 — 지도에서 바로 눈에 띄게 합니다 */
.pinbox.mine img{border-color:var(--coral)}
.kcluster.mine{box-shadow:0 0 0 2.5px var(--coral), 0 3px 10px rgba(0,0,0,.25)}
.pinbox img.lv,.pinbox.sel img.lv,.pinbox.mine img.lv{position:absolute;top:-11px;right:-11px;width:21px;height:auto;max-width:none;border:0;border-radius:0;box-shadow:none;background:none;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(30,24,16,.35))}
.pinbox .nm{margin-top:2px;background:rgba(255,255,255,.95);border-radius:5px;padding:1px 6px;
  font-size:9.5px;font-weight:600;white-space:nowrap;box-shadow:0 1px 3px rgba(30,24,16,.18)}
.kcluster{position:relative;border-radius:50%;cursor:pointer;border:2.5px solid #fff;overflow:hidden;
  box-shadow:0 4px 12px rgba(30,24,16,.3);transform:translate(-50%,-50%);background:#2B2A28}
.kcluster img{width:100%;height:100%;max-width:none;object-fit:cover;opacity:.55}
.kcluster .n{position:absolute;inset:0;display:grid;place-items:center;color:#fff;
  font-family:var(--mono);font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.mapctl{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;background:var(--paper);
  border-radius:11px;overflow:hidden;box-shadow:var(--sh2);z-index:4}
.mapctl button{width:34px;height:34px;display:grid;place-items:center;font-size:15px;color:var(--ink2)}
.mapctl button+button{border-top:1px solid var(--line)}
.mapctl button:hover{background:var(--sub)}
.toast{position:absolute;left:50%;top:84px;transform:translateX(-50%);z-index:5;background:var(--paper);
  box-shadow:var(--sh2);border-radius:999px;padding:8px 16px;font-size:12.5px;color:var(--ink2);white-space:nowrap}

/* 우측 */
.panelwrap{width:var(--panel-w);flex:none;position:relative;display:flex;min-height:0;
  border-left:1px solid var(--line)}
.panel{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.panel-h{flex:none;padding:15px 18px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.panel-h b{font-size:15px;font-weight:650}
.panel-h b i{font-style:normal;font-weight:400;color:var(--muted);font-size:12.5px}
.panel-h select{font:inherit;font-size:11.5px;color:var(--ink2);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:5px 7px;cursor:pointer;outline:none}
.results{flex:1;min-height:0;overflow-y:auto;padding:0 18px 20px;display:flex;flex-direction:column;gap:17px}
.rcard{display:flex;flex-direction:column;gap:8px;width:100%}
.rcard .img{height:142px;border-radius:13px;position:relative;overflow:hidden;background:var(--sub2)}
.rcard .img > img{width:100%;height:100%;object-fit:cover;transition:transform .25s}
.rcard:hover .img > img{transform:scale(1.03)}
.ytstack{position:absolute;left:9px;bottom:9px;display:flex;align-items:center;gap:6px;background:rgba(21,22,26,.82);
  border-radius:999px;padding:3px 10px 3px 3px;color:#fff;font-size:10.5px;font-weight:600;max-width:calc(100% - 18px)}
.ytstack .faces{display:flex;flex:none}
.ytstack .faces img{width:18px;height:18px;border-radius:50%;object-fit:cover;flex:none}
/* 두 번째 얼굴부터 살짝 겹칩니다. 테두리는 알약 배경색이라 경계가 보입니다. */
.ytstack .faces img + img{margin-left:-6px;box-shadow:0 0 0 1.5px #3A3B40}
.ytstack .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.durchip{position:absolute;right:9px;bottom:9px;background:rgba(0,0,0,.76);color:#fff;border-radius:4px;padding:1px 5px;font-family:var(--mono);font-size:9.5px}
/* ══ 실시간 투표 ══ */
/* 식당·영상·댓글과 같은 칸 모양으로 둡니다 — 같은 줄의 네 번째 지표입니다 */
/* ══ 바 폭 조절 ══
   가장자리를 끌어 왼쪽·오른쪽 바를 늘리고 줄입니다.
   손잡이는 6px 로 얇게 두고, 끌 때만 선이 보입니다. */
.grip{position:absolute;top:0;bottom:0;width:7px;z-index:20;cursor:col-resize;
  background:transparent;border:0;padding:0}
.grip::after{content:"";position:absolute;top:0;bottom:0;left:3px;width:1px;background:transparent;
  transition:background .12s}
.grip:hover::after,.grip.on::after{background:var(--coral)}
.grip.L{right:-4px}
.grip.R{left:-4px}
body.resizing{cursor:col-resize;user-select:none}
body.resizing iframe,body.resizing #kmap{pointer-events:none}
.bell{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;
  line-height:1.2;border:0;background:none;cursor:pointer;font-family:inherit;
  padding:3px 8px;border-radius:9px;color:inherit}
.bell:hover{background:var(--sub)}
.bell b{display:flex;align-items:center;justify-content:center;height:17px}
.bell .bi{flex:none;color:var(--ink2)}
.bell.live .bi{color:var(--coral)}
/* 안 본 글이 있을 때만 흔들립니다. 한 번만 흔들고 멈춥니다. */
.bell.live .bi{animation:ring .7s ease}
@keyframes ring{0%,100%{transform:rotate(0)}15%{transform:rotate(14deg)}
  30%{transform:rotate(-12deg)}45%{transform:rotate(9deg)}60%{transform:rotate(-6deg)}}
@media (prefers-reduced-motion:reduce){.bell.live .bi{animation:none}}
.bell span{font-size:10px;color:var(--muted)}
.bell .dot{position:absolute;right:2px;top:1px;width:7px;height:7px;border-radius:50%;
  background:var(--coral);box-shadow:0 0 0 2px #fff}
.bell .dot[hidden]{display:none!important}
.bell.live b{color:var(--coral)}
.bell.live span{color:var(--coral-ink)}
.bell.open{background:var(--sub)}

/* 지도 위에 떠 있는 검색창(지도 폭의 3/4, 가운데) + 동그란 투표 버튼(지도 오른쪽 위) */
.mapbar{position:absolute;top:16px;left:50%;transform:translateX(-50%);width:75%;max-width:calc(100% - 172px);z-index:30;display:flex;align-items:center;gap:10px}
.mapbar .srch{flex:1;height:52px;border-radius:999px;padding:0 20px;background:rgba(255,255,255,.72);
  -webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);
  border:1px solid rgba(255,255,255,.7);box-shadow:0 8px 24px rgba(30,24,16,.16)}
.mapbar .srch input{font-size:16px}
/* 검색으로 고른 지역 — 누르면 풉니다 */
.rchip{flex:none;display:flex;align-items:center;gap:6px;padding:5px 8px 5px 12px;border-radius:999px;
  background:var(--ink);color:#fff;font-size:13px;font-weight:600;white-space:nowrap}
.rchip::after{content:"×";font-size:14px;opacity:.7}
.rchip[hidden]{display:none}
.mapbar .srch input::placeholder{color:#8F8A83}
.mapbar .ac{left:0;right:0;top:calc(100% + 8px)}
.mapwrap>.bell{position:absolute;top:16px;right:16px;z-index:30;width:52px;height:52px;border-radius:50%;padding:0;justify-content:center;gap:0;
  background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);
  border:1px solid rgba(255,255,255,.7);box-shadow:0 8px 24px rgba(30,24,16,.16)}
.mapwrap>.bell:hover,.mapwrap>.bell.open{background:rgba(255,255,255,.95)}
.mapwrap>.bell .dot{right:9px;top:9px}
.mapwrap>.bell span:not(.dot){font-size:10px;letter-spacing:-.03em;font-weight:600;color:var(--ink2)}

/* 맥 알림처럼 오른쪽 위에서 밀려 들어옵니다 */
/* ══ 오류 신고 ══ */
.fbwrap{position:fixed;inset:0;z-index:90;display:grid;place-items:center;
  background:rgba(21,22,26,.42);padding:20px}
.fbwrap[hidden]{display:none!important}
.fbbox{background:#fff;border-radius:15px;max-width:400px;width:100%;padding:20px 22px;
  box-shadow:0 18px 50px rgba(0,0,0,.22)}
.fbbox h3{margin:0 0 4px;font-size:15px}
.fbbox p.s{margin:0 0 14px;font-size:11.5px;color:var(--ink2);line-height:1.55}
.fbkinds{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.fbkind{display:flex;align-items:center;gap:8px;padding:9px 11px;border:1.5px solid var(--line);
  border-radius:10px;background:#fff;font-size:12.5px;cursor:pointer;text-align:left;font-family:inherit}
.fbkind.on{border-color:var(--coral);background:var(--coral-soft);color:var(--coral-ink);font-weight:600}
.fbbox textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;
  font-size:12.5px;font-family:inherit;resize:none;height:62px;margin-bottom:12px}
.fbrow{display:flex;align-items:center;gap:8px}
.fbrow .note{font-size:10.5px;color:var(--muted);margin-right:auto;line-height:1.4}
.fbbox button.send{background:var(--coral);color:#fff;border:0;border-radius:9px;padding:9px 18px;
  font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
.fbbox button.send:disabled{background:var(--sub2);color:var(--muted);cursor:default}
.fbbox button.cancel{background:none;border:0;color:var(--muted);font-size:12px;
  text-decoration:underline;cursor:pointer;font-family:inherit}
/* ══ 새 투표 알림 ══
   클래스 이름을 .toast 로 두면 지도 가운데 "조건에 맞는 식당이 없습니다" 알약
   (.toast, 183행)과 겹칩니다. position·left·transform 이 그쪽에서 흘러들어와
   카드가 엉뚱한 자리로 끌려갔습니다. 그래서 .ntf 로 떼어 놓았습니다.

   자리: 지도 오른쪽 위 모서리. 오른쪽 바(330px)는 지금 읽는 목록이라 가리지 않고,
   확대·축소 버튼은 아래로 내려 모서리를 비웠습니다. */
.ntfs{position:fixed;right:calc(var(--panel-w) + 14px);top:88px;z-index:80;display:flex;flex-direction:column;
  align-items:flex-end;gap:8px;width:290px;max-width:calc(100vw - var(--side-w) - var(--panel-w) - 70px);pointer-events:none}
.ntf{position:static;pointer-events:auto;width:100%;box-sizing:border-box;
  background:rgba(255,255,255,.96);backdrop-filter:blur(12px);
  border:1px solid var(--line);border-radius:13px;padding:10px 12px;cursor:pointer;
  box-shadow:0 10px 28px rgba(0,0,0,.16);animation:ntfin .26s cubic-bezier(.2,.9,.3,1)}
.ntf.out{animation:ntfout .2s ease forwards}
@keyframes ntfin{from{opacity:0;transform:translateX(26px) scale(.97)}to{opacity:1;transform:none}}
@keyframes ntfout{to{opacity:0;transform:translateX(26px) scale(.97)}}
.ntf .th{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted);margin-bottom:3px}
.ntf .th b{color:var(--coral-ink);font-size:10px}
.ntf .tb{font-size:12px;line-height:1.45;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media (prefers-reduced-motion:reduce){.ntf{animation:none}.ntf.out{animation:none;opacity:0}}
/* 창이 좁으면 지도 폭이 안 나옵니다 — 그때는 오른쪽 바 위로 올립니다 */
@media (max-width:1040px){
  .ntfs{right:18px;top:88px;max-width:290px}
  body.pollopen .ntfs{right:348px}
}

/* 투표 패널 */
/* 오른쪽 바(.panel 330px)와 같은 폭·같은 자리에 둡니다 — 떠 있는 카드가 아니라
   그 칸이 투표로 바뀐 것처럼 보이게 합니다. */
.pollwrap{position:fixed;right:0;top:0;bottom:0;width:var(--panel-w);z-index:65;display:flex;
  flex-direction:column;background:#fff;border-left:1px solid var(--line);
  box-shadow:-10px 0 28px rgba(0,0,0,.08);overflow:hidden}
.pollwrap[hidden]{display:none!important}
.pollwrap>header{padding:12px 14px 9px;border-bottom:1px solid var(--line)}
.pollwrap h3{margin:0;font-size:13.5px}
.pollwrap .sub{font-size:10.5px;color:var(--muted);margin-top:2px;font-family:var(--mono)}
.pollwrap .x{position:absolute;right:10px;top:10px;border:0;background:none;font-size:15px;
  color:var(--muted);cursor:pointer;line-height:1}
.ptabs{display:flex;justify-content:center;gap:6px;margin-top:10px}
.ptab{flex:none;padding:6px 16px;border-radius:8px;border:1px solid var(--line);background:#fff;
  font-size:11.5px;font-weight:650;cursor:pointer;font-family:inherit;color:var(--ink2)}
.ptab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.pbody{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.pitem{border:1px solid var(--line);border-radius:11px;padding:9px 10px}
.pitem.hot{border-color:var(--coral);background:#FFFBF9}
.pitem .ph{display:flex;align-items:center;flex-wrap:wrap;gap:5px;font-size:11.5px;color:var(--muted);margin-bottom:5px}
.pitem .ph .au{color:var(--ink);font-weight:700}
.pitem .ph .rk{position:static;width:auto;height:auto;display:inline-block;font-size:10.5px;line-height:1.6;background:var(--coral);color:#fff;border-radius:5px;padding:0 5px;font-weight:700;font-family:inherit}
.pitem .ph .st{background:var(--sub2);color:var(--ink2);border-radius:5px;padding:0 5px;font-weight:600}
.pitem .pt{font-size:12.5px;line-height:1.5}
/* 내 글·답글 고치기·지우기 */
.own{margin-left:auto;display:inline-flex;gap:8px}
.ownb{border:0;background:none;padding:0;font:inherit;font-size:11px;color:var(--muted);cursor:pointer}
.ownb:hover{color:var(--ink)}
.pedit{display:flex;flex-direction:column;gap:6px}
.pedt{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;padding:6px 8px;
  font:inherit;font-size:12.5px;line-height:1.5;resize:vertical}
.pedt:focus{outline:2px solid var(--coral);outline-offset:-1px;border-color:transparent}
.pea{display:flex;justify-content:flex-end;align-items:center;gap:10px}
.pesave{border:0;background:var(--coral);color:#fff;border-radius:7px;padding:3px 11px;font:inherit;font-size:11.5px;font-weight:700;cursor:pointer}
.perr{margin:0;font-size:11px;color:var(--bad)}
.pdel{display:flex;align-items:center;gap:10px;margin-top:7px;padding:6px 9px;border-radius:8px;background:var(--sub);font-size:11.5px;color:var(--ink2)}
.pdel span{margin-right:auto}
.pdelgo{border:0;background:none;padding:0;font:inherit;font-size:11.5px;font-weight:700;color:var(--bad);cursor:pointer}
.bub .pedit{min-width:220px}
.bub.me .pdel{align-self:flex-end}
.pitem .pf{display:flex;align-items:center;gap:5px;margin-top:7px}
.vbtn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:2px 7px;font-size:11px;
  cursor:pointer;font-family:var(--mono);color:var(--ink2)}
.vbtn.on{background:var(--coral-soft);border-color:var(--coral);color:var(--coral-ink);font-weight:700}
.vbtn.dn.on{background:var(--sub2);border-color:var(--ink2);color:var(--ink)}
.rbtn{margin-left:auto;border:0;background:none;font-size:11px;color:var(--coral-ink);
  text-decoration:underline;cursor:pointer;font-family:inherit}
.plist{margin-top:7px;padding-top:7px;border-top:1px dashed var(--line);display:flex;
  flex-direction:column;gap:5px}
.prep{font-size:12px;line-height:1.5;color:var(--ink);display:flex;gap:7px;align-items:flex-start;background:var(--sub);border-radius:8px;padding:6px 8px}
.prep .who{font-size:11px;font-weight:700;color:var(--ink2);flex:none}
.plist .pl-h{font-size:11px;color:var(--muted)}
.prep .rv{margin-left:auto;flex:none}
.pform{border-bottom:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--sub)}
.pform[hidden]{display:none!important}
/* 글 올리기 — 동그란 배경 없이 주황색 + 하나만 */
.padd{position:absolute;right:38px;top:7px;width:28px;height:28px;border:0;background:none;color:var(--coral);
  font-size:26px;font-weight:400;line-height:1;display:grid;place-items:center;cursor:pointer;font-family:inherit;transition:opacity .12s}
.padd:hover{opacity:.7}
.pitem{cursor:pointer}
.pitem.sel{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
/* 글을 누르면 아래에서 올라오는 답글 채팅 */
.pthread{flex:none;max-height:58%;display:flex;flex-direction:column;border-top:1px solid var(--line);
  box-shadow:0 -10px 24px rgba(0,0,0,.08);background:#fff;position:relative}
/* 위 가장자리 손잡이 — 끌면 답글 창 높이가 바뀝니다. 높이를 정하면 max-height 는 풀립니다(app.js) */
.pth-grip{flex:none;height:12px;margin-bottom:-4px;cursor:row-resize;display:grid;place-items:center;touch-action:none}
.pth-grip::before{content:"";width:36px;height:4px;border-radius:2px;background:#CFC9C1;transition:background .12s}
.pth-grip:hover::before,.pth-grip.on::before,.pth-grip:focus-visible::before{background:var(--coral)}
.pth-grip:focus{outline:none}
body.resizing-y,body.resizing-y *{cursor:row-resize!important;user-select:none}
.pthread[hidden]{display:none!important}
.pth-h{display:flex;align-items:flex-start;gap:8px;padding:10px 12px 8px;border-bottom:1px solid var(--line)}
.pth-h p{margin:0;flex:1;font-size:12.5px;font-weight:700;line-height:1.45}
.pth-h .x2{border:0;background:none;font-size:16px;color:var(--muted);cursor:pointer;line-height:1;padding:0 2px}
.pth-list{flex:1;min-height:90px;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--sub)}
.pth-list .none{margin:auto;font-size:12px;color:var(--muted)}
.bub{max-width:82%;align-self:flex-start;display:flex;flex-direction:column;gap:2px}
.bub .nm{font-size:10.5px;font-weight:700;color:var(--ink2);padding-left:4px}
.bub .tx{background:#fff;border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:7px 10px;font-size:12.5px;line-height:1.5;overflow-wrap:anywhere}
.bub .mt{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted);padding-left:4px}
.bub.me{align-self:flex-end}
.bub.me .nm,.bub.me .mt{align-self:flex-end;padding:0 4px 0 0}
.bub.me .tx{background:var(--coral-soft);border-color:transparent;border-radius:14px 14px 4px 14px}
.pth-err{margin:0;padding:6px 12px 0;font-size:11px;color:var(--coral-ink)}
.pth-in{display:flex;gap:6px;padding:9px 12px}
.pth-in input{flex:1;min-width:0;border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-size:12.5px;font-family:inherit;outline:none}
.pth-in input:focus{border-color:var(--coral)}
.pth-in .send{background:var(--coral);color:#fff;border:0;border-radius:999px;padding:0 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.pth-in .send:disabled{background:var(--sub2);color:var(--muted);cursor:default}
.pform textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:7px 9px;
  font-size:12px;font-family:inherit;resize:none;height:54px}
.pform .row{display:flex;align-items:center;gap:6px}
.pform .tag b{color:var(--ink2);font-weight:600}
.locsw{border:0;background:none;color:var(--coral-ink);text-decoration:underline;
  font-size:10.5px;cursor:pointer;font-family:inherit;padding:0;margin-left:3px}
.pform .tag{font-size:10.5px;color:var(--muted);font-family:var(--mono);
  line-height:1.45}
.pform button.send{margin-left:auto;background:var(--coral);color:#fff;border:0;border-radius:8px;
  padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer;flex:none;font-family:inherit}
.pform button.send:disabled{background:var(--sub2);color:var(--muted);cursor:default}

/* 좌측 실시간 인기 */
.hotlist{display:flex;flex-direction:column;gap:3px}
.hotrow{display:flex;align-items:flex-start;gap:7px;padding:5px 6px;border-radius:8px;
  width:100%;text-align:left;background:none;border:0;cursor:pointer;font-family:inherit}
.hotrow:hover{background:var(--sub)}
.hotrow .n{font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--coral);
  flex:none;width:13px}
.hotrow .tx{font-size:11.5px;line-height:1.4;color:var(--ink);min-width:0;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hotrow .hm{font-family:var(--mono);font-size:9.5px;color:var(--muted);flex:none;margin-left:auto}
.hotempty{font-size:11px;color:var(--muted);line-height:1.5;padding:3px 6px}
/* ══ 선호 유튜버 고르기 ══ */
.favwrap{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
  background:rgba(21,22,26,.42);padding:20px}
.favwrap[hidden]{display:none!important}
.favbox{background:#fff;border-radius:16px;max-width:520px;width:100%;max-height:88vh;
  display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(0,0,0,.22)}
.favbox>header{padding:20px 22px 12px;border-bottom:1px solid var(--line)}
.favbox h2{font-size:17px;margin:0 0 5px}
.favbox p{margin:0;font-size:12px;color:var(--ink2);line-height:1.55}
.favgrid{overflow-y:auto;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.favcard{display:flex;align-items:center;gap:9px;padding:9px 10px;border:1.5px solid var(--line);
  border-radius:11px;background:#fff;cursor:pointer;text-align:left;position:relative}
.favcard img{width:36px;height:36px;border-radius:50%;flex:none;object-fit:cover;max-width:none}
.favcard b{display:block;font-size:12.5px;line-height:1.25}
.favcard s{display:block;font-size:11px;color:var(--muted);text-decoration:none}
.favcard.on{border-color:var(--coral);background:var(--coral-soft)}
.favcard.on::after{content:"✓";position:absolute;right:9px;top:50%;transform:translateY(-50%);
  color:var(--coral-ink);font-weight:800;font-size:13px}
.favcard[disabled]{opacity:.45;cursor:default}
.favbox>footer{padding:12px 22px 18px;border-top:1px solid var(--line);display:flex;
  align-items:center;gap:10px}
.favbox>footer span{font-size:12px;color:var(--ink2);margin-right:auto}
.favbox button.go{background:var(--coral);color:#fff;border:0;border-radius:9px;
  padding:10px 20px;font-size:13px;font-weight:700;cursor:pointer}
.favbox button.skip{background:none;border:0;color:var(--muted);font-size:12px;
  text-decoration:underline;cursor:pointer}

  border:1px solid var(--coral);border-radius:7px;padding:2px 7px;font-size:10px;font-weight:700}
.favbtns{display:flex;align-items:center;gap:7px;margin-left:auto;margin-right:7px}
.favedit{font-size:11px;color:var(--coral-ink);text-decoration:underline;background:none;border:0;cursor:pointer;font-family:inherit}

.favedit[hidden]{display:none!important}
.lvchip{position:absolute;left:9px;top:9px;background:var(--coral);color:#fff;border-radius:7px;padding:3px 8px 3px 5px;font-size:10px;font-weight:700;display:flex;align-items:center;gap:4px}
.lvb{width:20px;height:auto;flex:none;display:block}
.rk{position:absolute;right:9px;top:9px;width:24px;height:24px;border-radius:8px;background:rgba(255,255,255,.93);
  color:#15161A;display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:600}
.rmeta h5{margin:0;font-size:14px;font-weight:650}
/* 식당 이름 줄 오른쪽 끝에 100점 점수 */
.rtitle{display:flex;align-items:baseline;gap:8px}
.rtitle h5{flex:1;min-width:0}
.rsc{flex:none;font-size:14px;font-weight:800;color:var(--coral-ink);font-variant-numeric:tabular-nums}
.rsub{font-family:var(--mono);font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:7px;margin-top:3px;flex-wrap:wrap}
.rsub+.rsub{margin-top:2px}
.dot{width:3px;height:3px;border-radius:50%;background:var(--line);flex:none}
.rsub .ev{color:var(--teal-ink);font-weight:600}
.rsub .ng{color:var(--bad);font-weight:600}
.rsub .wt{color:var(--amber);font-weight:600}
.empty{padding:44px 18px;text-align:center;font-size:12.5px;color:var(--muted);line-height:1.7}

.det{flex:1;display:flex;flex-direction:column;min-height:0}
.det-hero{height:164px;position:relative;flex:none;overflow:hidden;background:var(--sub2)}
/* 썸네일 전체가 영상 링크입니다. 전에는 가운데 ▶(48×34px)만 눌렸습니다. */
.det-open{position:absolute;inset:0;display:block;text-decoration:none}

.det-title h3{margin:0 0 5px;font-size:19px;font-weight:700;letter-spacing:-.022em}
.det-title .addr{font-size:11.5px;color:var(--muted);line-height:1.5}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.bdg{padding:3px 8px;border-radius:6px;font-size:10.5px;font-weight:600}
.bdg.c{background:var(--coral-soft);color:var(--coral-ink);display:inline-flex;align-items:center;gap:4px}
.bdg.s{background:var(--ink);color:#fff;font-weight:700}
.bdg.t{background:var(--teal-soft);color:var(--teal-ink)}
.bdg.n{background:var(--sub2);color:var(--muted);font-weight:500}
.bdg.w{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-ln)}
.blk{display:flex;flex-direction:column;gap:9px}
.blk-t{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.vid{display:flex;gap:10px;width:100%;border-radius:10px;text-decoration:none;color:inherit}
.vid:hover{background:var(--sub)}
.vthumb{width:118px;height:66px;border-radius:9px;position:relative;overflow:hidden;flex:none;background:var(--sub2)}
.vthumb > img{width:100%;height:100%;object-fit:cover}
.vthumb .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:30px;height:21px;border-radius:6px;background:var(--yt);display:grid;place-items:center;color:#fff;font-size:9px}
.vthumb .dur{position:absolute;right:5px;bottom:5px;background:rgba(0,0,0,.78);color:#fff;border-radius:4px;padding:1px 4px;font-family:var(--mono);font-size:9px}
.vinfo{min-width:0;display:flex;flex-direction:column;gap:4px;justify-content:center;padding:2px 0}
.vinfo .vt{font-size:12px;font-weight:600;line-height:1.38}
.vinfo .vc{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--ink2);font-weight:500}
.vinfo .vc img{width:16px;height:16px;border-radius:50%;object-fit:cover;flex:none}
.vinfo .vm{font-family:var(--mono);font-size:9.5px;color:var(--muted)}
.kv{display:flex;gap:7px;margin:0}
.kv div{flex:1;background:var(--sub);border-radius:11px;padding:9px 10px;display:flex;flex-direction:column;gap:2px}
.kv dt{font-size:10.5px;color:var(--muted)}
.kv dd{margin:0;font-family:var(--mono);font-size:15px;font-weight:600}
.aspects{display:flex;flex-direction:column;gap:7px}
.asp{display:grid;grid-template-columns:48px 1fr 64px;align-items:center;gap:9px}
.asp .an{font-size:11.5px;font-weight:600;color:var(--ink2)}
.asp .bar{height:7px;border-radius:4px;background:var(--sub2);overflow:hidden;display:flex}
.asp .bar .p{background:var(--good)}
.asp .bar .n{background:var(--bad)}
.asp .av{font-family:var(--mono);font-size:10px;color:var(--muted);text-align:right;white-space:nowrap}
.quote{background:var(--sub);border-radius:11px;padding:10px 12px;font-size:11.5px;line-height:1.55;color:var(--ink2)}
.quote .qm{display:flex;gap:9px;margin-top:7px;font-family:var(--mono);font-size:9.5px;color:var(--muted)}
.note{background:var(--sub);border-radius:11px;padding:11px 12px;font-size:11.5px;line-height:1.6;color:var(--ink2);margin:0}
.aisum .aitag{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:5px;background:var(--coral);color:#fff;font-size:9px;letter-spacing:.05em;vertical-align:1px}
.ail{border:1px solid var(--line);border-radius:11px;margin:6px 0;background:var(--surface,#fff)}
.ail summary{list-style:none;cursor:pointer;display:flex;gap:8px;align-items:baseline;padding:9px 11px;font-size:12px;line-height:1.5;color:var(--ink)}
.ail summary::-webkit-details-marker{display:none}
.ail .k{flex:none;font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--sub);color:var(--ink2)}
.ail.good .k{color:var(--good)}.ail.bad .k{color:var(--bad)}
.ail .n{margin-left:auto;flex:none;font-family:var(--mono);font-size:9.5px;color:var(--muted)}
.ail[open] summary{border-bottom:1px solid var(--line)}
.ail .quote{margin:8px 10px}
.aimeta{margin:6px 0 0;font-family:var(--mono);font-size:9.5px;line-height:1.5;color:var(--muted)}
.caveat{background:var(--amber-bg);border:1px solid var(--amber-ln);border-radius:11px;padding:9px 11px;font-size:10.5px;line-height:1.5;color:var(--amber);margin:0}
.acts{flex:none;display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.acts a,.acts button{flex:1;padding:11px;border-radius:10px;text-align:center;font-size:13px;font-weight:600;text-decoration:none}
.pri{background:#FEE500;color:#191600}
.sec{border:1px solid var(--line);color:var(--ink2);font-weight:500}
</style>
</head><body>
<div id="app">
  <div class="body">
    <div class="sidewrap">
      <button class="grip L" id="gripL" aria-label="왼쪽 바 폭 조절"></button>
    <div class="topleft">
    <a class="brand" href="/" title="처음 화면으로 — 유튜버 바꾸기"><img class="mark" src="/img/brand/logo-64.png?v=3" alt="" width="28" height="28"><b>르슐랭 가이드</b></a>
    </div>
      <aside class="side">
      <div class="sgrp">
        <div class="catrow" id="cats"></div>
      </div>
      <div class="sgrp">
      <p class="sect-t"><b>유튜버</b>
          <span class="favbtns"><button class="favedit" id="favEdit">내 유튜버 고르기</button><button class="favedit favoff" id="favClear" hidden>해제</button></span>
          <span id="creHint"></span></p>
        <div class="ytlist" id="cres"></div>
      </div>
      <div class="sgrp">
        <p class="sect-t"><b>최근 영상</b><span id="feedCnt"></span></p>
        <div class="feed" id="feed"></div>
      </div>
      <div class="sgrp" id="hotGrp">
        <p class="sect-t"><b>실시간 인기글</b><span id="hotHint">오늘 0건</span></p>
        <div class="hotlist" id="hotList"></div>
      </div>
      <div class="sgrp">
        <p class="sect-t"><b>조건</b><button id="resetF" style="font-size:11px;color:var(--coral-ink);text-decoration:underline">초기화</button></p>
        <div class="frow">
          <div class="flab"><span>영상 조회수</span><em id="vwLab"></em></div>
          <div class="hist" id="vwHist"></div>
          <input type="range" id="vwMin" min="0" max="100" value="0">
          <div class="scaleRow"><span>1천</span><span>1000만</span></div>
        </div>
        <div class="frow">
          <div class="flab"><span>방문 반응 최소</span><em id="evLab"></em></div>
          <input type="range" id="evMin" min="0" max="40" value="0">
        </div>
        <div class="frow togrow">
          <button class="tog" id="onlyWait" aria-pressed="false">줄 서는 집<i></i></button>
          <button class="tog" id="onlyRated" aria-pressed="false">반응 있는 곳<i></i></button>
        </div>
      </div>
      </aside>
    </div>
    <div class="mapwrap">
      <div id="kmap"></div>
    <div class="mapbar">
      <div class="srch">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.7"/><path d="M11 11l3.3 3.3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <button class="rchip" id="rchip" hidden aria-label="지역 풀기"></button>
        <input id="q" placeholder="지역, 식당, 유튜버로 검색" autocomplete="off">
        <button class="clr" id="clr" hidden>&times;</button>
        <div class="ac" id="ac" hidden></div>
      </div>
    </div>
      <!-- 투표 버튼은 검색창과 떼어 지도 오른쪽 위, 오른쪽 목록 바 바로 옆에 둡니다 -->
      <button class="bell" id="bell" aria-label="실시간 커뮤니티 열기">
        <b><svg class="bi" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 1.6a3.4 3.4 0 0 0-3.4 3.4v2.6L3.1 10.1h9.8L11.4 7.6V5A3.4 3.4 0 0 0 8 1.6Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M6.3 11.9a1.75 1.75 0 0 0 3.4 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></b>
        <span>커뮤니티</span><span class="dot" id="bellDot" hidden></span>
      </button>

      <div class="mapmsg" id="mapmsg" hidden><div>
        <h3>카카오맵을 불러오지 못했습니다</h3>
        <p id="mapmsgBody"></p>
      </div></div>
      <div class="mapctl">
        <button id="zIn">+</button><button id="zOut">&minus;</button><button id="zFit" style="font-size:12px">⤢</button>
      </div>
      <div class="toast" id="toast" hidden></div>
    </div>
    <div class="panelwrap">
      <button class="grip R" id="gripR" aria-label="오른쪽 바 폭 조절"></button>
      <section class="panel" id="panel"></section>
    </div>
  </div>
</div>
  <div class="ntfs" id="ntfs" aria-live="polite"></div>

  <section class="pollwrap" id="pollWrap" hidden aria-label="실시간 커뮤니티">
    <header>
      <button class="padd" id="pollAdd" aria-label="글 올리기" aria-expanded="false">+</button>
      <button class="x" id="pollX" aria-label="닫기">&times;</button>
      <h3>실시간 커뮤니티</h3>
      <p class="sub" id="pollSub">밤 12시에 새로고침됩니다</p>
      <div class="ptabs">
        <button class="ptab on" id="tabHot">반응 많은 순</button>
        <button class="ptab" id="tabNew">최신순</button>
      </div>
    </header>
    <div class="pform" id="pollForm" hidden>
      <textarea id="pollText" maxlength="300"
        placeholder="예) 연남동 근처 혼밥하기 좋은 곳 아시는 분 달아주세요"></textarea>
      <div class="row">
        <span class="tag" id="pollTag">위치 확인 중</span>
        <button class="send" id="pollSend" disabled>올리기</button>
      </div>
    </div>
    <div class="pbody" id="pollBody"></div>
    <div class="pthread" id="pThread" hidden>
      <div class="pth-grip" id="pThGrip" role="separator" aria-orientation="horizontal" aria-label="답글 창 높이 조절" tabindex="0"></div>
      <div class="pth-h"><p class="t2" id="pThTitle"></p><button class="x2" id="pThX" aria-label="답글 창 닫기">&times;</button></div>
      <div class="pth-list" id="pThList"></div>
      <p class="pth-err" id="pThErr" hidden></p>
      <div class="pth-in"><input id="pThText" maxlength="300" placeholder="답글 달기" autocomplete="off"><button class="send" id="pThSend" disabled>보내기</button></div>
    </div>
  </section>

  <div class="fbwrap" id="fbWrap" hidden>
    <div class="fbbox" role="dialog" aria-modal="true" aria-labelledby="fbTitle">
      <h3 id="fbTitle">정보가 틀렸나요?</h3>
      <p class="s" id="fbStore">알려주시면 운영자가 확인하고 고칩니다.</p>
      <div class="fbkinds" id="fbKinds"></div>
      <textarea id="fbBody" maxlength="500"
        placeholder="자세히 적어주시면 빨리 고칠 수 있습니다 (선택)"></textarea>
      <div class="fbrow">
        <span class="note">로그인 없이 보냅니다.<br>개인을 알 수 있는 정보는 받지 않습니다.</span>
        <button class="cancel" id="fbCancel">닫기</button>
        <button class="send" id="fbSend" disabled>보내기</button>
      </div>
    </div>
  </div>
  <div class="favwrap" id="favWrap" hidden>
    <div class="favbox" role="dialog" aria-modal="true" aria-labelledby="favTitle">
      <header>
        <h2 id="favTitle">좋아하는 유튜버를 고르세요</h2>
        <p>최대 10명까지 고를 수 있습니다. 고른 채널이 간 식당을 지도와 목록에서 먼저 보여줍니다.
           다른 채널도 그대로 보입니다 — 숨기지 않습니다.</p>
      </header>
      <div class="favgrid" id="favGrid"></div>
      <footer>
        <span id="favCnt">0 / 10</span>
        <button class="skip" id="favReset" hidden>모두 해제</button>
        <button class="skip" id="favSkip">그냥 둘러보기</button>
        <button class="go" id="favGo">이대로 보기</button>
      </footer>
    </div>
  </div>
<script>
/* 키는 URL 로 주면 주소창에 남습니다. 배포에서는 서버가 환경변수에서
   내려주는 /api/mapkey 를 씁니다. ?key= 는 로컬에서 쓰던 길로 남겨 둡니다. */
window.__MAPKEY__ = new URLSearchParams(location.search).get("key") || "";
</script>
<script src="app.js?v=fav2"></script>
</body></html>
