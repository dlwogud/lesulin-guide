<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>르슐랭 가이드</title>
<meta name="description" content="좋아하는 유튜버가 간 식당, 다녀왔다고 적은 사람들은 뭐라고 했을까?">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap">
<style>
/* 시작 화면 v3 — 지도 화면과 같은 언어(오렌지 마름모 로고, 상단 숫자, 오렌지 링 핀, 배지 달린 카드)를 쓰는 밝은 첫 화면.
   제목 → [영상 · 댓글 · 지도] 한 장의 둥근 패널 → 유튜버 고르기. 오렌지는 선택과 핵심 숫자에만 씁니다. */
:root{
  --bg:#FFFFFF; --bg-2:#F8F6F3; --ink:#1F1B18; --ink-2:#6B635C; --ink-3:#A39B93; --line:#ECE8E3;
  --orange:#F2622A; --orange-soft:#FEEDE5; --orange-text:#D9501A; --on-orange:#FFFFFF;
  --pos:#17806B; --pos-soft:#E3F4EF; --neg:#D9392B; --neg-soft:#FCE9E6; --water:#B7DBEE;
  --shadow:0 1px 2px rgba(60,40,20,.04),0 12px 40px rgba(60,40,20,.07);
  --font:"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141211; --bg-2:#1E1B19; --ink:#F4F0EC; --ink-2:#B5ACA3; --ink-3:#7E766E; --line:#302B28;
  --orange:#FF7440; --orange-soft:#3A2218; --orange-text:#FF8F63; --on-orange:#1A0C05;
  --pos:#58C7AC; --pos-soft:#12302A; --neg:#FF7B6E; --neg-soft:#3A1B18; --water:#1B2F3B;
  --shadow:0 12px 40px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141211; --bg-2:#1E1B19; --ink:#F4F0EC; --ink-2:#B5ACA3; --ink-3:#7E766E; --line:#302B28;
  --orange:#FF7440; --orange-soft:#3A2218; --orange-text:#FF8F63; --on-orange:#1A0C05;
  --pos:#58C7AC; --pos-soft:#12302A; --neg:#FF7B6E; --neg-soft:#3A1B18; --water:#1B2F3B;
  --shadow:0 12px 40px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased;word-break:keep-all;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:env(safe-area-inset-top,0px) 80px}
img{display:block;max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:left}
:focus-visible{outline:2px solid var(--orange);outline-offset:3px;border-radius:6px}
[hidden]{display:none!important}
.wrap{max-width:1200px;margin:0 auto}

/* ── 상단 바 ── */
nav{display:flex;align-items:center;gap:8px 20px;padding-block:18px;flex-wrap:wrap}
/* 헤더 한 줄 문구 — 작지만 눈에 띄게, 줄바꿈 없이 */
#tagline{margin:0;font-size:13px;font-weight:700;color:var(--orange-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
@media(max-width:1100px){#tagline{order:3;flex-basis:100%}}
@media(max-width:760px){#tagline{font-size:12.5px}}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:-.02em;text-decoration:none}
.mark{width:34px;height:34px;border-radius:10px;background:var(--orange);display:grid;place-items:center;flex:none}
.mark::after{content:"";width:12px;height:12px;background:#fff;transform:rotate(45deg);border-radius:2px}
nav .st{margin-left:auto;display:flex;gap:26px}
nav .st div{text-align:center;line-height:1.2}
nav .st b{display:block;font-family:var(--mono);font-weight:600;font-size:16px}
nav .st span{font-size:11px;color:var(--ink-3)}
.cta{display:inline-block;background:var(--orange);color:var(--on-orange);padding:12px 20px;font-size:14px;font-weight:700;
  border-radius:12px;transition:transform .15s,filter .15s;white-space:nowrap;text-decoration:none}
.cta:hover{transform:translateY(-1px);filter:brightness(1.05)}
#stats[hidden]+.cta{margin-left:auto}
@media(max-width:760px){nav .st{display:none}nav .cta{margin-left:auto;padding:10px 14px;font-size:13px}}

/* ── 제목 ── */
.hero{padding-block:56px 36px;display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap}
h1{font-size:clamp(30px,5.4vw,60px);line-height:1.14;letter-spacing:-.05em;font-weight:900;margin:0;text-wrap:balance}
h1 em{font-style:normal;color:var(--orange)}
.big{text-align:right}
.big b{display:block;font-family:var(--mono);font-weight:600;font-size:clamp(56px,9vw,104px);line-height:.95;
  letter-spacing:-.05em;color:var(--orange)}
.big span{font-size:13px;color:var(--ink-2)}
@media(max-width:760px){.big{text-align:left}}

/* ── 세 칸 ── */
.stage{border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);background:var(--bg);padding:22px;
  display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:22px}
.col{min-width:0;position:relative}
/* 식당 하나를 골랐을 때만 2번 칸 오른쪽 위에 — 칸 머리글을 없앴으니 여기서 되돌립니다 */
.selbar{position:absolute;top:10px;right:10px;z-index:3}
.reset{font:700 12px var(--font);color:var(--orange-text);background:var(--bg);border:1.5px solid var(--orange);
  padding:5px 12px;border-radius:99px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.port{height:470px;overflow:hidden;position:relative;border-radius:18px;background:var(--bg-2);
  -webkit-mask-image:linear-gradient(transparent,#000 7%,#000 93%,transparent);mask-image:linear-gradient(transparent,#000 7%,#000 93%,transparent)}
.port.static{overflow-y:auto;-webkit-mask-image:none;mask-image:none;scrollbar-width:thin}
.track{display:flex;flex-direction:column;gap:12px;padding:12px;animation:roll var(--dur,40s) linear infinite}
.port:hover .track,.port:focus-within .track{animation-play-state:paused}
.port.static .track{animation:none}
.port.r .track{animation-direction:reverse}
@keyframes roll{to{transform:translateY(-50%)}}
@media (prefers-reduced-motion:reduce){.track{animation:none!important}.port{overflow-y:auto;-webkit-mask-image:none;mask-image:none}}

.vcard,.rcard{display:block;cursor:pointer;background:var(--bg);border:1.5px solid transparent;border-radius:16px;
  transition:border-color .2s,box-shadow .2s}
.vcard{padding:8px}.rcard{padding:14px}
.vcard:hover,.rcard:hover{box-shadow:0 4px 16px rgba(60,40,20,.08)}
.vcard[aria-pressed="true"],.rcard[aria-pressed="true"]{border-color:var(--orange)}
.thumb{aspect-ratio:16/10;border-radius:12px;position:relative;overflow:hidden;color:#fff;background:#3a2a20;display:block;text-decoration:none}
.thumb>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.05) 35%,rgba(0,0,0,.55))}
.thumb>*:not(img){z-index:1}
.thumb .who{white-space:nowrap}
.bd{position:absolute;top:9px;left:9px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:7px;background:var(--orange);color:#fff}
.thumb .who{position:absolute;left:9px;bottom:9px;display:flex;align-items:center;gap:6px;background:rgba(20,14,10,.55);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);padding:3px 10px 3px 4px;border-radius:99px;font-size:12px;font-weight:500}
.av{width:20px;height:20px;border-radius:50%;object-fit:cover;background:var(--bg);flex:none}
.thumb .du{position:absolute;right:10px;bottom:9px;font-family:var(--mono);font-size:11px}
.vt{font-weight:700;font-size:15px;margin:10px 4px 0;letter-spacing:-.02em;display:block}
.vt a{text-decoration:none}.vt a:hover{text-decoration:underline}
.vm{margin:2px 4px 2px;font-size:12px;color:var(--ink-3);display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.vm .p{color:var(--pos);font-weight:700}.vm .n{color:var(--neg);font-weight:700}
.vm span{white-space:nowrap}
.vm i{font-style:normal;color:var(--line)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:7px}
.tag.p{background:var(--pos-soft);color:var(--pos)}.tag.n{background:var(--neg-soft);color:var(--neg)}
.rcard q{display:block;quotes:none;margin:9px 0 0;font-size:14px;line-height:1.65;overflow-wrap:anywhere}
.rcard small{display:block;color:var(--ink-3);font-size:12px;margin:8px 0 0}
.rcard small a{color:var(--ink-2)}
.empty{display:grid;place-items:center;text-align:center;height:100%;padding:20px;color:var(--ink-3);font-size:13px}

.mapbox{height:470px;background:var(--water);position:relative;overflow:hidden;border-radius:18px}
#introMap{position:absolute;inset:0}
/* 핀 — 유튜버 얼굴 + 오렌지 링(지도 화면과 같은 모양). 고른 식당은 오렌지 후광 */
.ipin{width:38px;height:38px;border-radius:50%;padding:0;border:3px solid var(--orange);background:#fff;cursor:pointer;
  box-shadow:0 0 0 3px #fff,0 3px 10px rgba(0,0,0,.25);transform:translateY(-50%);transition:transform .2s;overflow:hidden}
.ipin img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.ipin:hover{transform:translateY(-50%) scale(1.1)}
.ipin.sel{box-shadow:0 0 0 3px #fff,0 0 0 9px color-mix(in srgb,var(--orange) 30%,transparent)}
.icluster{width:44px;height:44px;border-radius:50%;padding:0;display:grid;place-items:center;border:3px solid var(--orange);background:#8B8279;color:#fff;
  font:600 15px var(--mono);cursor:pointer;box-shadow:0 0 0 3px #fff,0 3px 10px rgba(0,0,0,.25);transform:translateY(-50%);transition:transform .2s}
.icluster:hover{transform:translateY(-50%) scale(1.1)}
.icluster.sel{background:var(--orange)}
.zoom{position:absolute;right:10px;bottom:10px;z-index:5;display:flex;flex-direction:column;border-radius:12px;overflow:hidden;
  background:var(--bg);box-shadow:0 4px 14px rgba(0,0,0,.15)}
.zoom button{width:36px;height:36px;font-size:18px;text-align:center}
.zoom button+button{border-top:1px solid var(--line)}
.place{position:absolute;left:10px;right:56px;bottom:10px;z-index:6;background:var(--bg);padding:14px 16px;border-radius:14px;
  box-shadow:0 8px 28px rgba(0,0,0,.2)}
.place h3{margin:0;font-size:16px;letter-spacing:-.02em;padding-right:20px}
.place p{margin:2px 0 12px;color:var(--ink-2);font-size:12px}
.place .row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--bg);padding:8px 14px;font-size:12px;font-weight:700;text-decoration:none;border-radius:10px}
.btn.pri{background:var(--orange);border-color:var(--orange);color:#fff}
.place .x{position:absolute;right:12px;top:8px;font-size:18px;color:var(--ink-3)}
#introMapList{position:absolute;inset:0;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
#introMapList a{display:flex;justify-content:space-between;gap:10px;background:var(--bg);padding:12px 14px;border-radius:12px;
  text-decoration:none;font-weight:700}
#introMapList small{color:var(--ink-3);font-weight:400}
@media(max-width:900px){.stage{grid-template-columns:1fr;padding:16px}.port,.mapbox{height:390px}}

/* ── 유튜버 고르기 ── */
.picker{margin:0 0 22px;display:flex;flex-direction:column;gap:14px}
.picker .hd{display:flex;gap:10px 14px;align-items:baseline;flex-wrap:wrap}
.picker h2{margin:0;font-size:20px;font-weight:900;letter-spacing:-.04em}
.picker .hd .c{margin-left:auto;font-family:var(--mono);font-weight:600;font-size:13px;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:9px;padding:6px 14px 6px 6px;background:var(--bg);border:1.5px solid var(--line);
  border-radius:99px;font-size:14px;font-weight:700;transition:border-color .2s,background .2s}
.chip small{color:var(--ink-3);font:500 12px var(--mono)}
.chip img{width:28px;height:28px;border-radius:50%;object-fit:cover;border:1.5px solid var(--line);flex:none}
.chip:hover{border-color:var(--orange)}
.chip[aria-pressed="true"]{border-color:var(--orange);background:var(--orange-soft)}
.chip[aria-pressed="true"] img{border-color:var(--orange);box-shadow:0 0 0 2px var(--orange)}
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <a class="brand" href="/"><span class="mark" aria-hidden="true"></span>르슐랭 가이드</a>
    <p id="tagline">좋아하는 유튜버가 방문한 맛집의 반응을 알아보세요!</p>
    <div class="st" id="stats" hidden>
      <div><b id="statStores"></b><span>식당</span></div>
      <div><b id="statVideos"></b><span>영상</span></div>
      <div><b id="statComments"></b><span>댓글</span></div>
    </div>
    <a class="cta" id="toMap" href="/map.html">맛집 지도 보러가기 →</a>
  </nav>

  <section class="hero">
    <div>
      <h1 id="hero">좋아하는 유튜버가 간 식당,<br><em>다녀왔다고 적은 사람들</em>은<br>뭐라고 했을까?</h1>
    </div>
    <div class="big" id="bigWrap" hidden><b id="bigNum"></b><span>건의 방문 후기</span></div>
  </section>

  <section class="picker" aria-labelledby="pickTitle">
    <div class="hd"><h2 id="pickTitle">내 유튜버를 고르세요</h2><span class="c" id="pickCnt">즐겨찾기 0 / 3</span></div>
    <div class="chips" id="chips"></div>
  </section>

  <section class="stage" id="stage">
    <div class="col" id="st1">
      <div class="port" id="listVideos"></div>
    </div>
    <div class="col" id="st2">
      <div class="selbar" id="selbar" hidden><button class="reset" id="rs">전체 보기</button></div>
      <div class="port r" id="listReviews"></div>
    </div>
    <div class="col" id="st3">
      <div class="mapbox">
        <div id="introMap" aria-label="맛집 지도"></div>
        <div class="zoom" id="zoom" hidden><button id="iZin" aria-label="확대">+</button><button id="iZout" aria-label="축소">−</button></div>
        <div class="place" id="place" hidden></div>
        <div id="introMapList" hidden></div>
      </div>
    </div>
  </section>

</div>
<script src="start.js?v=13" defer></script>
</body>
</html>
