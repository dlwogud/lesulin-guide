<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>르슐랭 가이드</title>
<meta name="description" content="좋아하는 유튜버가 간 식당, 다녀왔다고 적은 사람들은 뭐라고 했을까?">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap">
<style>
/* 시작 화면 — 지도에 들어가기 전에 르슐랭이 무엇을 보여주는지 먼저 봅니다.
   색상 토큰은 map.html :root 와 같은 값입니다. */
:root{
  --paper:#FFFFFF; --sub:#F6F5F3; --sub2:#EFEEE9; --shell:#F4F2EF;
  --ink:#15161A; --ink2:#43444B; --muted:#8A8780; --line:#E8E6E1;
  --coral:#FF5A2B; --coral-soft:#FFE9E0; --coral-ink:#C33C13;
  --yt:#E8402A;
  --sans:'Archivo','IBM Plex Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--shell);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;word-break:keep-all}   /* 한국어는 어절 단위로 줄바꿈 */
img{display:block;max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}

.page{max-width:1180px;margin:0 auto;padding:0 28px}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0}
.logo{font-weight:800;font-size:18px;letter-spacing:-.3px;text-decoration:none}
.logo i{color:var(--coral);font-style:normal}
.skip-top{font-size:12.5px;color:var(--muted);text-decoration:none}
.skip-top:hover{color:var(--ink)}

h1{font-size:clamp(26px,3.4vw,38px);line-height:1.25;letter-spacing:-.9px;margin:6px 0 0;font-weight:800}
h1 em{font-style:normal;color:var(--coral)}
.lead{color:var(--ink2);font-size:14.5px;margin:12px 0 0}

/* ── 예시: ① 영상 → ② 다녀왔다고 적은 사람들 → ③ 지도 ── */
#ex{margin-top:30px}
.story{display:grid;grid-template-columns:minmax(0,1.05fr) auto minmax(0,1.35fr) auto minmax(0,.8fr);gap:16px;
  align-items:start;padding:20px;background:var(--paper);border:1px solid var(--line);border-radius:18px}
.arrow{align-self:center;color:var(--coral);font-size:22px;font-weight:800;padding-top:28px}
.step{font-size:12px;font-weight:700;color:var(--coral-ink);margin-bottom:9px}
.thumb{position:relative;display:block;border-radius:12px;overflow:hidden;aspect-ratio:16/9;background:#222}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb b{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:48px;height:34px;
  border-radius:9px;background:var(--yt);color:#fff;display:grid;place-items:center;font-size:13px;transition:transform .12s}
.thumb:hover b{transform:translate(-50%,-50%) scale(1.08)}
.vt{font-weight:700;font-size:13.5px;margin-top:9px;text-decoration:none;display:block}
.vm{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px;margin-top:2px}
.vm img{width:16px;height:16px;border-radius:50%}
.count{display:flex;align-items:baseline;gap:9px;margin-bottom:10px;flex-wrap:wrap}
.count b{font-size:30px;font-weight:800;letter-spacing:-.6px;color:var(--coral)}
.count span{font-size:12.5px;color:var(--ink2)}
.qs{display:flex;flex-direction:column;gap:9px}
.q{background:var(--sub);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.6}
.q .tag{display:inline-block;font-size:11px;font-weight:700;border-radius:5px;padding:1px 7px;margin-bottom:6px}
.q.g .tag{background:#E3F5EC;color:#0F7A52}
.q.b .tag{background:#FCE8E6;color:#B23B30}
.q p{margin:0;overflow-wrap:anywhere}
.q .meta{display:block;margin-top:7px;font-size:11px;color:var(--muted)}
.q .meta a{color:var(--ink2)}
.place{background:var(--sub);border-radius:12px;padding:14px}
.place b{display:block;font-size:15px}
.place .where{font-size:12px;color:var(--ink2)}
.place .btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.place a{font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:8px;padding:6px 10px;
  background:#fff;text-decoration:none}
.place a:hover{border-color:var(--coral)}

/* ── 유튜버 고르기 ── */
.pick{margin-top:30px}
.pick h2{font-size:16px;margin:0 0 10px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:40px}
.chip{display:flex;align-items:center;gap:8px;padding:5px 13px 5px 5px;border:1.5px solid var(--line);
  border-radius:99px;background:#fff;font-size:13px;font-weight:600;transition:border-color .1s,background .1s}
.chip img{width:28px;height:28px;border-radius:50%;object-fit:cover}
.chip s{text-decoration:none;color:var(--muted);font-weight:400;font-size:11.5px}
.chip[aria-pressed="true"]{border-color:var(--coral);background:var(--coral-soft)}
.chip:hover{border-color:#cfcac0}

.foot{display:flex;align-items:center;gap:18px;padding:22px 0 36px;flex-wrap:wrap}
.cta{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border-radius:12px;
  padding:14px 22px;font-weight:700;font-size:15px}
.cta:hover{background:#000}
.ghost{font-size:13px;color:var(--muted);text-decoration:underline}
#pickCnt{margin-left:auto;font-size:12.5px;color:var(--ink2);transition:color .15s}
#pickCnt.warn{color:var(--coral-ink);font-weight:700}

/* ── 모바일: ①②③을 세로로, 버튼은 아래에 붙여 둡니다 ── */
@media (max-width:720px){
  .page{padding:0 16px}
  .story{grid-template-columns:minmax(0,1fr);gap:10px;padding:16px}
  .arrow{padding:0;justify-self:center;transform:rotate(90deg);font-size:18px}
  .foot{position:sticky;bottom:0;background:var(--shell);margin:0 -16px;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);gap:12px}
  .cta{flex:1;justify-content:center}
  #pickCnt{margin-left:0}
}
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <a class="logo" href="/">르슐랭<i>.</i></a>
    <a class="skip-top" href="/map.html">지도로 바로 가기 →</a>
  </header>

  <h1 id="hero">좋아하는 유튜버가 간 식당,<br><em>다녀왔다고 적은 사람들</em>은 뭐라고 했을까?</h1>
  <p class="lead" id="lead">유튜버들의 영상과, 그 영상에 "다녀왔다"고 적은 댓글을 함께 봅니다.</p>

  <section id="ex" aria-label="실제 식당 예시">
    <div class="story">
      <div id="st1">
        <div class="step">① 영상에서 봤다</div>
        <div id="exVideo">
          <a class="thumb" id="exThumb" target="_blank" rel="noreferrer"><img id="exThumbImg" alt=""><b>▶</b></a>
          <a class="vt" id="exTitle" target="_blank" rel="noreferrer"></a>
          <div class="vm"><img id="exChImg" alt=""><span id="exVideoMeta"></span></div>
        </div>
      </div>
      <div class="arrow" aria-hidden="true">→</div>
      <div id="st2">
        <div class="step">② 다녀왔다고 적은 사람들은</div>
        <div class="count" id="exCount"><b id="exVisits"></b><span id="exCountNote"></span></div>
        <div class="qs">
          <div class="q g" id="exGood"><span class="tag">좋았다는 이야기</span><p id="exGoodText"></p>
            <span class="meta" id="exGoodMeta"></span></div>
          <div class="q b" id="exBad"><span class="tag">아쉬웠다는 이야기</span><p id="exBadText"></p>
            <span class="meta" id="exBadMeta"></span></div>
        </div>
      </div>
      <div class="arrow" aria-hidden="true">→</div>
      <div id="st3">
        <div class="step">③ 지도에서 찾기</div>
        <div class="place" id="exPlace">
          <b id="exName"></b><span class="where" id="exWhere"></span>
          <div class="btns">
            <a id="exMap">지도에서 보기</a>
            <a id="exRoute" target="_blank" rel="noreferrer">길찾기</a>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="pick" aria-labelledby="pickTitle">
    <h2 id="pickTitle">내 유튜버를 고르세요</h2>
    <div class="chips" id="chips"></div>
  </section>

  <div class="foot">
    <button class="cta" id="go">내 유튜버 맛집 지도 보기 →</button>
    <button class="ghost" id="skip">그냥 둘러보기</button>
    <span id="pickCnt" aria-live="polite">0 / 3</span>
  </div>
</div>
<script src="start.js?v=2" defer></script>
</body>
</html>
