<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>르슐랭 가이드</title>
<link rel="icon" type="image/png" sizes="32x32" href="/lesulin-icon-32.png?v=4">
<link rel="icon" type="image/png" sizes="192x192" href="/lesulin-icon-192.png?v=4">
<link rel="shortcut icon" href="/lesulin-favicon.ico?v=4">
<link rel="apple-touch-icon" href="/img/brand/apple-icon.png?v=4">
<meta name="description" content="좋아하는 유튜버가 간 식당, 다녀왔다고 적은 사람들은 뭐라고 했을까?">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 시작 화면 v4 — 가이드북 표지. 흰 바탕에 로고 주황 테두리, 제목은 Jua.
   검정·주황·크림은 로고와 배지에서 뽑은 색 그대로. 검정은 표지 한 장에만, 주황은 선택과 행동에만,
   크림은 "다녀온 사람의 말"(댓글 카드)에만 씁니다. 화면 요소 id 는 start.js 가 쓰는 것과 같습니다. */
:root{
  --black:#000000; --orange:#FB5C01; --orange-ink:#B54000; --cream:#FEEED3; --paper:#FFFFFF;
  --ink:#000000; --ink-2:#5C544D; --ink-3:#8E857C; --line:#E9E3DB; --well:#F7F3EE;
  --pos:#12705C; --pos-soft:#E1F2EC; --neg:#C2321F; --neg-soft:#FBE6E2; --water:#B7DBEE;
  --on-cover:#FFFFFF; --on-cover-2:rgba(255,255,255,.62); --cover-line:rgba(255,255,255,.2);
  --display:"Bagel Fat One","Black Han Sans","Apple SD Gothic Neo",system-ui,sans-serif;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1B1815; --ink:#F6F1EB; --ink-2:#C2B8AE; --ink-3:#8F867D; --line:#332E29; --well:#24201C;
  --orange-ink:#FF8A47; --cream:#3A2E1F; --pos:#5CC8AE; --pos-soft:#14302A; --neg:#FF7F70; --neg-soft:#3B1D19; --water:#1B2F3B;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1B1815; --ink:#F6F1EB; --ink-2:#C2B8AE; --ink-3:#8F867D; --line:#332E29; --well:#24201C;
  --orange-ink:#FF8A47; --cream:#3A2E1F; --pos:#5CC8AE; --pos-soft:#14302A; --neg:#FF7F70; --neg-soft:#3B1D19; --water:#1B2F3B;
  color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;word-break:keep-all;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:env(safe-area-inset-top,0px) 88px}
img{display:block;max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:left}
:focus-visible{outline:2px solid var(--orange);outline-offset:3px;border-radius:8px}
[hidden]{display:none!important}
.wrap{max-width:1200px;margin:0 auto;padding-top:22px}

/* ── 상단 ── */
/* 상단은 표지(주황 테두리) 안 첫 줄. 오른쪽은 리본 자리만큼 비웁니다 */
nav{display:flex;align-items:center;gap:10px 28px;flex-wrap:wrap;margin:-8px 0 clamp(26px,4vw,44px);padding-right:86px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;font-family:"Jua",var(--display);font-size:30px;letter-spacing:-.01em}
.mark{width:54px;height:54px;flex:none}
.st{margin-left:auto;display:flex;gap:20px;font-size:13px;color:var(--ink-2)}
.st b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;margin-right:3px}
.cta{display:inline-block;background:var(--orange);color:#fff;padding:12px 22px;font-size:15px;font-weight:700;
  border-radius:12px;white-space:nowrap;text-decoration:none}
.cta:hover{background:#E35200}
#stats[hidden]+.cta{margin-left:auto}
@media(max-width:760px){.st{display:none}.cta{margin-left:auto;padding:10px 16px;font-size:14px}
  .brand{font-size:22px;gap:9px}.mark{width:40px;height:40px}nav{padding-right:0;margin-top:30px}}

/* ── 표지: 로고의 검은 타일을 키운 것. 오른쪽 위에 르슐랭 리본이 책갈피로 걸립니다 ── */
.cover{position:relative;background:var(--black);color:var(--on-cover);border-radius:36px;
  padding:clamp(28px,5vw,60px) clamp(22px,5vw,60px) clamp(26px,4vw,44px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cover{box-shadow:inset 0 0 0 1px var(--cover-line)}}
:root[data-theme="dark"] .cover{box-shadow:inset 0 0 0 1px var(--cover-line)}
.ribbon{position:absolute;top:-4px;right:clamp(22px,5vw,60px);width:66px;height:auto;
  animation:drop .7s cubic-bezier(.2,.9,.3,1.25) .15s both}
@keyframes drop{from{transform:translateY(-70%);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.ribbon{animation:none}}
/* 제목은 창을 줄여도 늘 두 줄 그대로 — 줄마다 한 줄로 묶고, 글자 크기가 창 폭을 따라 줄어듭니다 */
h1{font-family:"Jua",var(--display);font-weight:400;font-size:clamp(20px,6vw,80px);line-height:1.22;letter-spacing:-.01em;
  margin:0;padding-right:76px}
h1 .ln{display:block;white-space:nowrap}
@media(max-width:420px){h1{font-size:5.3vw}}
.picker{margin-top:clamp(28px,4vw,44px)}
.picker .hd{display:flex;align-items:baseline;gap:8px 16px;flex-wrap:wrap;margin-bottom:14px}
.picker h2{margin:0;font-size:16px;font-weight:700}
.picker .c{font-size:13px;color:var(--on-cover-2);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:9px;padding:5px 15px 5px 5px;border-radius:999px;
  border:1.5px solid var(--cover-line);color:var(--on-cover);font-size:14px;font-weight:600;transition:background .15s,border-color .15s}
.chip img{width:30px;height:30px;border-radius:50%;object-fit:cover;flex:none;background:#333}
.chip small{color:var(--on-cover-2);font-size:12px;font-weight:500;font-variant-numeric:tabular-nums}
.chip:hover{border-color:rgba(255,255,255,.55)}
.chip[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#fff}
.chip[aria-pressed="true"] small{color:rgba(255,255,255,.85)}
.big{margin:22px 0 0;font-size:15px;color:var(--on-cover-2)}
.big b{color:var(--on-cover);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}

/* 표지: 흰 바탕 + 로고 주황 테두리 */
.cover.cv-line{background:var(--paper);box-shadow:inset 0 0 0 3px var(--orange);--on-cover:var(--ink);--on-cover-2:var(--ink-2);--cover-line:var(--line)}
.cover.cv-line .chip{border-color:var(--line)}
.cover.cv-line .chip img{background:var(--well)}
.cover.cv-line .chip:hover{border-color:var(--orange)}

/* ── 세 칸: 영상 · 다녀온 사람들 이야기 · 지도 ── */
.stage{margin-top:28px;display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:20px}
/* 세 칸은 각자 회색 테두리 칸 — 카드와 지도가 칸 안쪽에 들어앉게 */
.col{min-width:0;position:relative;border:1.5px solid var(--line);border-radius:26px;padding:16px 14px 14px;background:var(--paper)}
.col>h2{margin:0 0 10px 6px;font-size:15px;font-weight:700}
.selbar{position:absolute;top:14px;right:16px;z-index:3}
.reset{font-size:13px;font-weight:700;color:var(--orange-ink);text-decoration:underline;text-underline-offset:3px}
.port{height:480px;overflow:hidden;position:relative;border-radius:22px;background:var(--paper);
  -webkit-mask-image:linear-gradient(transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(transparent,#000 6%,#000 94%,transparent)}
.port.static{overflow-y:auto;-webkit-mask-image:none;mask-image:none;scrollbar-width:thin}
.track{display:flex;flex-direction:column;gap:12px;padding:12px 2px;animation:roll var(--dur,40s) linear infinite}
.port.static .track{animation:none}
.port.r .track{animation-direction:reverse}
@keyframes roll{to{transform:translateY(-50%)}}
@media (prefers-reduced-motion:reduce){.track{animation:none!important}.port{overflow-y:auto;-webkit-mask-image:none;mask-image:none}}

.vcard,.rcard{display:block;cursor:pointer;border:2px solid transparent;border-radius:16px}
/* 영상 카드 하나 = 썸네일 + 제목 + 정보를 회색 선 한 칸으로 */
.vcard{padding:8px 8px 10px;background:var(--paper);border:1px solid #DDD6CD}
.vcard[aria-pressed="true"]{border-color:var(--orange);box-shadow:0 0 0 1px var(--orange)}
.rcard[aria-pressed="true"]{border-color:var(--orange);box-shadow:0 0 0 1px var(--orange)}
.thumb{aspect-ratio:16/10;border-radius:11px;position:relative;overflow:hidden;color:#fff;background:#2a211b;display:block;text-decoration:none}
.thumb>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.1),transparent 40%,rgba(0,0,0,.55))}
.thumb>*:not(img){z-index:1}
/* 배지는 표지의 리본과 같은 그림 — 크림 리본 + 이름, 검은 바탕 */
.bd{position:absolute;top:9px;left:9px;display:flex;align-items:center;gap:5px;background:var(--black);color:#fff;
  font-size:12px;font-weight:600;padding:3px 10px 3px 5px;border-radius:8px}
.bd img{width:20px;height:auto}
.thumb .who{position:absolute;left:9px;bottom:9px;display:flex;align-items:center;gap:6px;white-space:nowrap;
  background:rgba(0,0,0,.55);padding:3px 10px 3px 4px;border-radius:999px;font-size:12px;font-weight:500}
.av{width:20px;height:20px;border-radius:50%;object-fit:cover;flex:none}
.thumb .du{position:absolute;right:10px;bottom:9px;font-size:12px;font-variant-numeric:tabular-nums}
.vt{display:block;font-weight:700;font-size:16px;margin:10px 4px 0;letter-spacing:-.01em}
.vt a{text-decoration:none}.vt a:hover{text-decoration:underline}
.vm{margin:2px 4px 2px;font-size:12.5px;color:var(--ink-3);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.vm span{white-space:nowrap}.vm i{font-style:normal;color:var(--line)}
.vm .p{color:var(--pos);font-weight:700}.vm .n{color:var(--neg);font-weight:700}

/* 다녀온 사람의 말은 배지와 같은 크림 위에 */
/* 댓글 하나 = 태그 + 원문 + 출처를 같은 회색 선 한 칸으로 */
.rcard{background:var(--paper);border:1px solid #DDD6CD;padding:14px 14px 12px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:6px}
.tag.p{background:var(--pos-soft);color:var(--pos)}.tag.n{background:var(--neg-soft);color:var(--neg)}
.rcard q{display:block;quotes:none;margin:10px 0 0;font-size:15px;line-height:1.7;overflow-wrap:anywhere}
.rcard small{display:block;color:var(--ink-2);font-size:12.5px;margin:10px 0 0}
.rcard small a{color:var(--ink)}
.empty{display:grid;place-items:center;text-align:center;height:100%;padding:20px;color:var(--ink-3);font-size:14px}

.mapbox{height:480px;background:var(--water);position:relative;overflow:hidden;border-radius:22px}
#introMap{position:absolute;inset:0}
.ipin{width:38px;height:38px;border-radius:50%;padding:0;border:3px solid var(--orange);background:#fff;cursor:pointer;
  box-shadow:0 0 0 3px #fff,0 3px 10px rgba(0,0,0,.25);transform:translateY(-50%);transition:transform .2s;overflow:hidden}
.ipin img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.ipin:hover{transform:translateY(-50%) scale(1.1)}
.ipin.sel{box-shadow:0 0 0 3px #fff,0 0 0 9px color-mix(in srgb,var(--orange) 30%,transparent)}
/* 묶음 = 묶인 유튜버 얼굴(최대 3명)을 겹친 알약 + 모서리 숫자 */
.icluster{position:relative;height:44px;border-radius:999px;padding:3px 5px 3px 3px;display:flex;align-items:center;border:3px solid var(--orange);background:#fff;
  cursor:pointer;box-shadow:0 0 0 3px #fff,0 3px 10px rgba(0,0,0,.25);transform:translateY(-50%);transition:transform .2s}
.icluster img{width:32px;height:32px;border-radius:50%;object-fit:cover;flex:none;box-shadow:0 0 0 2px #fff;background:#eee}
.icluster img+img{margin-left:-12px}
.icluster .n{position:absolute;top:-11px;right:-11px;min-width:23px;height:23px;padding:0 6px;border-radius:999px;background:var(--black);color:#fff;
  font:700 12.5px/23px var(--font);text-align:center;box-shadow:0 0 0 2px #fff}
.icluster:hover{transform:translateY(-50%) scale(1.1)}
.icluster.sel .n{background:var(--orange)}
.zoom{position:absolute;right:10px;bottom:10px;z-index:5;display:flex;flex-direction:column;border-radius:12px;overflow:hidden;
  background:var(--paper);box-shadow:0 4px 14px rgba(0,0,0,.15)}
.zoom button{width:38px;height:38px;font-size:18px;text-align:center}
.zoom button+button{border-top:1px solid var(--line)}
.place{position:absolute;left:10px;right:58px;bottom:10px;z-index:6;background:var(--paper);padding:14px 16px;border-radius:16px;
  box-shadow:0 8px 28px rgba(0,0,0,.2)}
.place h3{margin:0;font-size:17px;padding-right:22px}
.place p{margin:2px 0 12px;color:var(--ink-2);font-size:12.5px}
.place .row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1.5px solid var(--line);background:var(--paper);padding:7px 14px;font-size:13px;font-weight:700;text-decoration:none;border-radius:999px}
.btn.pri{background:var(--orange);border-color:var(--orange);color:#fff}
.place .x{position:absolute;right:12px;top:8px;font-size:19px;color:var(--ink-3)}
#introMapList{position:absolute;inset:0;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
#introMapList a{display:flex;justify-content:space-between;gap:10px;background:var(--paper);padding:12px 14px;border-radius:12px;text-decoration:none;font-weight:700}
#introMapList small{color:var(--ink-3);font-weight:400}
@media(max-width:900px){.stage{grid-template-columns:1fr}.port,.mapbox{height:400px}}
@media(max-width:520px){.col{padding:12px 10px 10px;border-radius:20px}}
@media(max-width:520px){.cover{border-radius:26px}.ribbon{width:50px}h1{padding-right:52px}
  .chips{gap:6px}.chip{gap:7px;padding:4px 12px 4px 4px;font-size:13px}.chip img{width:26px;height:26px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="cover cv-line">
    <img class="ribbon" src="/img/brand/badge-3.png" alt="" width="66" height="70">
    <nav>
      <a class="brand" href="/"><img class="mark" src="/img/brand/logo-128.png?v=4" alt="" width="54" height="54">르슐랭 가이드</a>
      <div class="st" id="stats" hidden>
        <span><b id="statStores"></b>식당</span>
        <span><b id="statVideos"></b>영상</span>
        <span><b id="statComments"></b>댓글</span>
      </div>
      <a class="cta" id="toMap" href="/map.html">맛집 지도 열기 →</a>
    </nav>
    <h1 id="hero"><span class="ln">좋아하는 유튜버가 간 식당,</span><span class="ln">직접 다녀온 사람들의 반응은?</span></h1>
    <section class="picker" aria-labelledby="pickTitle">
      <div class="hd"><h2 id="pickTitle">내 유튜버를 고르세요</h2></div>
      <div class="chips" id="chips"></div>
    </section>
  </header>

  <section class="stage" id="stage">
    <div class="col" id="st1">
      <h2>유튜버가 소개한 식당</h2>
      <div class="port" id="listVideos"></div>
    </div>
    <div class="col" id="st2">
      <h2>다녀온 사람들 이야기</h2>
      <div class="selbar" id="selbar" hidden><button class="reset" id="rs">전체 보기</button></div>
      <div class="port r" id="listReviews"></div>
    </div>
    <div class="col" id="st3">
      <h2>지도</h2>
      <div class="mapbox">
        <div id="introMap" aria-label="맛집 지도"></div>
        <div class="zoom" id="zoom" hidden><button id="iZin" aria-label="확대">+</button><button id="iZout" aria-label="축소">−</button></div>
        <div class="place" id="place" hidden></div>
        <div id="introMapList" hidden></div>
      </div>
    </div>
  </section>
</div>
<script src="/start.js?v=21" defer></script>
</body>
</html>
